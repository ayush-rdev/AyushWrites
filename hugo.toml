baseURL = "https://ayushwrites.pages.dev/"
disqusShortname = ""
enableGitInfo = true
enableRobotsTXT = true
hasCJKLanguage = true
locale = "en-us"
rssLimit = 10
theme = "hugo-texify3"
title = "AyushWrites"

[pagination]
pagerSize = 5

[taxonomies]
tags = "tags"
categories = "categories"

[markup.goldmark.renderer]
unsafe = true

[params]
title = "AyushWrites"
author = "Ayush"
description = "Ayush's personal blog"
footnote = """
Powered by <a class=link href=https://gohugo.io target=_blank rel=noopener>Hugo</a> | 
Theme <a class=link href=https://github.com/michaelneuper/hugo-texify3 target=_blank rel=noopener>TeXify3</a>
"""
customCSS = []
customJS = []
dateFormat = "2 January 2006"
emphasisWithDots = true
toc = true
rootFontSize = "105%"
math = true
enableDuckDuckGoSearchBox = true
numberedSubtitles = true

  [params.commentEngine]
  code = ""

  [params.buymeacoffee]
  code = ""

  [params.sharingbuttons]
  facebook = true
  twitter = true
  email = true
  linkedin = true
  reddit = true
  whatsapp = true
  hackernews = true
  telegram = true
